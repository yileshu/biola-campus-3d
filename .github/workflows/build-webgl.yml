name: Build Web (WebGL) player

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      webgpu:
        description: "Add WebGPU (experimental, with WebGL 2 fallback)"
        type: boolean
        default: false
      deploy:
        description: "Deploy to GitHub Pages after the build"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Secret scan (abort if a Google API key is committed)
        run: bash Tools/git/check-secrets.sh

      - name: Refresh OSM cache if it is still a placeholder (not committed)
        continue-on-error: true
        run: python3 Tools/osm/fetch_osm.py --if-placeholder

      - name: Write Assets/Config/secrets.json from the GOOGLE_MAPS_API_KEY secret
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "${GOOGLE_MAPS_API_KEY}" ]; then
            echo "::warning::GOOGLE_MAPS_API_KEY secret is not set - the build will run in offline OSM mode."
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          with open("Assets/Config/secrets.json", "w") as f:
              json.dump({"googleMapsApiKey": os.environ["GOOGLE_MAPS_API_KEY"]}, f)
          PY
          echo "secrets.json written (value masked)."

      - name: Free disk space for the Unity image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-urp-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-WebGL-urp-

      - name: Build with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: BiolaCampus3D
          buildMethod: BiolaCampus.EditorTools.BuildScript.BuildWebGL
          customParameters: -webgpu ${{ inputs.webgpu && 'true' || 'false' }}
          allowDirtyBuild: true
          versioning: None

      - name: Remove secrets from the workspace
        if: always()
        run: rm -f Assets/Config/secrets.json && sudo rm -rf Assets/Resources/Generated || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiolaCampus3D-WebGL
          path: build/WebGL/BiolaCampus3D
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/BiolaCampus3D

  build-windows:
    name: Build Windows (desktop, High preset)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Secret scan (abort if a Google API key is committed)
        run: bash Tools/git/check-secrets.sh
      - name: Write Assets/Config/secrets.json from the GOOGLE_MAPS_API_KEY secret
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "${GOOGLE_MAPS_API_KEY}" ]; then echo "::warning::GOOGLE_MAPS_API_KEY not set"; exit 0; fi
          python3 -c "import json,os; json.dump({'googleMapsApiKey': os.environ['GOOGLE_MAPS_API_KEY']}, open('Assets/Config/secrets.json','w'))"
      - name: Free disk space for the Unity image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Win64-urp-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Win64-urp-
      - name: Build with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: BiolaCampus3D
          buildMethod: BiolaCampus.EditorTools.BuildScript.BuildWindows
          allowDirtyBuild: true
          versioning: None
      - name: Remove secrets from the workspace
        if: always()
        run: rm -f Assets/Config/secrets.json && sudo rm -rf Assets/Resources/Generated || true
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BiolaCampus3D-Windows
          path: build/StandaloneWindows64
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Runs on every push to main (unless the repo variable DEPLOY_PAGES is "false") and on manual "deploy".
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && vars.DEPLOY_PAGES != 'false')
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  capture:
    name: Screenshots (headless Chrome)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright + Chromium
        working-directory: Tools/capture
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture the 4 fixed spots from the deployed site
        working-directory: Tools/capture
        run: node capture.mjs "${{ needs.deploy.outputs.page_url }}" "$GITHUB_WORKSPACE/shots" "run ${{ github.run_number }} @ ${{ github.sha }}"
      - name: Show diagnostics
        if: always()
        run: grep -hE "BiolaDiag|BIOLA_SHOT|pageerror|http [45]" shots/console.log | head -80 || true
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: shots
      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [ -d shots ] || exit 0
          dir="runs/$(printf '%05d' ${{ github.run_number }})-${GITHUB_SHA::7}"
          mkdir pub && cd pub
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ci-screenshots; then git checkout -q -b ci-screenshots FETCH_HEAD; else git checkout -q --orphan ci-screenshots; fi
          mkdir -p "$dir" latest
          cp ../shots/* "$dir"/
          rm -rf latest && mkdir latest && cp ../shots/* latest/
          git add -A
          git commit -q -m "Screenshots for run ${{ github.run_number }} (${GITHUB_SHA::7})"
          git push -q origin ci-screenshots
          echo "Published to ci-screenshots:$dir"
